<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home / Yapper</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/components.js"></script>
<script src="js/tenor.js"></script>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="feed-header">
      <div class="tabs">
        <div class="tab active" id="tab-for-you" onclick="switchTab('for_you')">For you</div>
        <div class="tab" id="tab-following" onclick="switchTab('following')">Following</div>
      </div>
    </div>

    <div class="compose-box" id="compose-area">
      <div id="compose-avatar"></div>
      <div class="compose-right">
        <textarea id="compose-text" placeholder="What's on your mind?" maxlength="280" oninput="updateCompose()"></textarea>
        <div id="compose-preview"></div>
        <div class="compose-actions">
          <div class="compose-tools">
            <button class="tool-btn" onclick="document.getElementById('compose-file').click()" title="Photo / Video">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <button class="tool-btn gif-btn" id="compose-gif-btn" onclick="openGifPicker('compose-gif-btn', url => setComposeGif(url))" title="GIF">GIF</button>
            <input type="file" id="compose-file" accept="image/*,video/*" style="display:none" onchange="handleComposeFile(event)">
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <span class="char-count" id="char-count">0/280</span>
            <button class="yap-btn" id="yap-btn" onclick="submitYap()" disabled>Yap</button>
          </div>
        </div>
      </div>
    </div>

    <div id="feed"><div class="loading"><div class="spinner"></div></div></div>
  </main>
  <aside class="aside" id="aside"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
let currentProfile = null;
let currentTab = 'for_you';
let posts = [];
let loadingFeed = false;
let composeMedia = null; // { file?: File, url: string, type: 'image'|'video'|'gif' }
let pendingPosts = [];
let realtimeChannel = null;
let myFollowingIds = new Set();

async function init() {
  const session = await requireAuth();
  if (!session) return;
  currentProfile = await getCurrentProfile();
  window.currentProfile = currentProfile;
  if (!currentProfile?.username) { window.location.href = 'setup.html'; return; }

  document.getElementById('sidebar').innerHTML = sidebarHtml('home', currentProfile);
  document.getElementById('compose-avatar').innerHTML = avatarHtml(currentProfile, 40);
  document.getElementById('aside').innerHTML = asideHtml();
  document.getElementById('compose-nav-btn').addEventListener('click', () => document.getElementById('compose-text').focus());

  // Load bookmarks, blocks, and reposts state for use in postHtml
  const [bkRes, blRes, rpRes] = await Promise.all([
    _supabase.from('bookmarks').select('post_id').eq('user_id', currentProfile.id),
    _supabase.from('blocks').select('blocked_id').eq('blocker_id', currentProfile.id),
    _supabase.from('posts').select('id,repost_of').eq('user_id', currentProfile.id).not('repost_of', 'is', null)
  ]);
  window._bookmarks = new Set((bkRes.data||[]).map(b => b.post_id));
  window._blocked   = new Set((blRes.data||[]).map(b => b.blocked_id));
  window._reposts   = new Map((rpRes.data||[]).map(r => [r.repost_of, r.id]));

  // Cache my follow list for the realtime "Following" filter
  const { data: fl } = await _supabase.from('follows').select('following_id').eq('follower_id', currentProfile.id);
  myFollowingIds = new Set((fl||[]).map(f => f.following_id));

  loadFeed();
  loadSuggestions();
  subscribeFeed();
  document.getElementById('aside-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.location.href = `explore.html?q=${encodeURIComponent(e.target.value)}`;
  });
}

// ── Realtime feed ────────────────────────────────────────────────
function subscribeFeed() {
  if (realtimeChannel) _supabase.removeChannel(realtimeChannel);
  realtimeChannel = _supabase
    .channel('feed-posts')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'posts' },
      async (payload) => {
        const np = payload.new;
        if (np.reply_to) return;                                  // skip replies
        if (np.user_id === currentProfile.id) return;             // own posts appear on submit
        if (window._blocked?.has(np.user_id)) return;             // skip blocked
        if (currentTab === 'following' && !myFollowingIds.has(np.user_id)) return;

        // Already pending?
        if (pendingPosts.some(p => p.id === np.id)) return;

        const { data: full } = await _supabase.from('posts')
          .select(`*, profiles!user_id(id,username,display_name,avatar_url,is_verified,is_admin,is_super_admin), likes(user_id)`)
          .eq('id', np.id).single();
        if (!full) return;

        const enriched = {
          ...full,
          liked_by_me: (full.likes||[]).some(l => l.user_id === currentProfile.id),
          likes_count: (full.likes||[]).length
        };

        pendingPosts.unshift(enriched);
        showNewPostsPill();
      })
    .subscribe();
}

function showNewPostsPill() {
  let pill = document.getElementById('new-posts-pill');
  if (!pill) {
    pill = document.createElement('button');
    pill.id = 'new-posts-pill';
    pill.className = 'new-posts-pill';
    pill.onclick = flushNewPosts;
    document.body.appendChild(pill);
  }
  const c = pendingPosts.length;
  pill.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg> ${c} new Yap${c === 1 ? '' : 's'}`;
  pill.classList.add('show');
}

function hideNewPostsPill() {
  document.getElementById('new-posts-pill')?.classList.remove('show');
}

async function flushNewPosts() {
  if (!pendingPosts.length) return;
  // Re-attach originals for any reposts/quotes
  const merged = await attachOriginals([...pendingPosts, ...posts], currentProfile.id);
  posts = merged;
  pendingPosts = [];
  document.getElementById('feed').innerHTML = posts.map(p => postHtml(p, currentProfile.id)).join('');
  hideNewPostsPill();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab) {
  currentTab = tab;
  pendingPosts = [];
  hideNewPostsPill();
  document.getElementById('tab-for-you').classList.toggle('active', tab === 'for_you');
  document.getElementById('tab-following').classList.toggle('active', tab === 'following');
  loadFeed();
}

async function loadFeed() {
  if (loadingFeed) return;
  loadingFeed = true;
  document.getElementById('feed').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  let query = _supabase.from('posts')
    .select(`*, profiles!user_id(id,username,display_name,avatar_url,is_verified,is_admin,is_super_admin), likes(user_id)`)
    .is('reply_to', null)
    .order('created_at', { ascending: false })
    .limit(50);

  if (currentTab === 'following') {
    const { data: follows } = await _supabase.from('follows').select('following_id').eq('follower_id', currentProfile.id);
    const ids = (follows || []).map(f => f.following_id);
    ids.push(currentProfile.id);
    query = query.in('user_id', ids);
  }

  const { data, error } = await query;
  loadingFeed = false;
  if (error) { document.getElementById('feed').innerHTML = `<div class="empty-state"><p>Error: ${escapeHtml(error.message)}</p></div>`; return; }

  let rawPosts = (data || []).map(p => ({
    ...p,
    liked_by_me: (p.likes||[]).some(l => l.user_id === currentProfile.id),
    likes_count: (p.likes||[]).length
  }));

  // Filter out blocked users' posts
  if (window._blocked?.size) rawPosts = rawPosts.filter(p => !window._blocked.has(p.user_id));

  // Attach original posts for reposts/quotes
  rawPosts = await attachOriginals(rawPosts, currentProfile.id);
  // Also filter blocked originals
  if (window._blocked?.size) rawPosts = rawPosts.filter(p => !p.repost_of || !window._blocked.has(p.original_post?.user_id));

  posts = rawPosts;

  if (!posts.length) {
    const msg = currentTab === 'following'
      ? '<h3>Follow people to see their Yaps</h3><p>Go to <a href="explore.html" style="color:var(--accent)">Explore</a>.</p>'
      : '<h3>No Yaps yet</h3><p>Be the first to post something!</p>';
    document.getElementById('feed').innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }
  document.getElementById('feed').innerHTML = posts.map(p => postHtml(p, currentProfile.id)).join('');
}

// ── Compose media ──────────────────────────────
function handleComposeFile(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 50 * 1024 * 1024) { showToast('File must be under 50 MB'); return; }
  composeMedia = { file, url: URL.createObjectURL(file), type: file.type.startsWith('video') ? 'video' : 'image' };
  renderComposePreview(); updateCompose();
}

function setComposeGif(url) {
  composeMedia = { url, type: 'gif' };
  renderComposePreview(); updateCompose();
}

function renderComposePreview() {
  const wrap = document.getElementById('compose-preview');
  if (!composeMedia) { wrap.innerHTML = ''; return; }
  const inner = composeMedia.type === 'video'
    ? `<video src="${composeMedia.url}" controls style="width:100%;max-height:300px;border-radius:16px;display:block"></video>`
    : `<img src="${composeMedia.url}" style="width:100%;max-height:300px;object-fit:cover;border-radius:16px;display:block">`;
  wrap.innerHTML = `<div class="media-preview-wrap">${inner}<button class="media-preview-remove" onclick="clearComposeMedia()">✕</button></div>`;
}

function clearComposeMedia() {
  composeMedia = null;
  document.getElementById('compose-file').value = '';
  renderComposePreview(); updateCompose();
}

function updateCompose() {
  const text = document.getElementById('compose-text').value;
  const count = document.getElementById('char-count');
  count.textContent = `${text.length}/280`;
  count.className = 'char-count' + (text.length > 260 ? ' warning' : '') + (text.length > 280 ? ' over' : '');
  document.getElementById('yap-btn').disabled = (!text.trim() && !composeMedia) || text.length > 280;
}

async function submitYap() {
  const content = document.getElementById('compose-text').value.trim();
  if (!content && !composeMedia) return;
  const btn = document.getElementById('yap-btn');
  btn.disabled = true; btn.textContent = 'Posting…';

  let media_url = null, media_type = null;
  if (composeMedia) {
    if (composeMedia.type === 'gif') {
      media_url = composeMedia.url; media_type = 'gif';
    } else {
      const ext = composeMedia.file.name.split('.').pop().toLowerCase();
      const path = `${currentProfile.id}/${Date.now()}.${ext}`;
      const { error: upErr } = await _supabase.storage.from('post-media').upload(path, composeMedia.file, { contentType: composeMedia.file.type });
      if (!upErr) {
        const { data: ud } = _supabase.storage.from('post-media').getPublicUrl(path);
        media_url = ud.publicUrl; media_type = composeMedia.type;
      } else { showToast('Upload failed: ' + upErr.message); btn.disabled = false; btn.textContent = 'Yap'; return; }
    }
  }

  const { error } = await _supabase.from('posts').insert({ user_id: currentProfile.id, content: content || null, media_url, media_type });
  if (error) { showToast('Error: ' + error.message); btn.disabled = false; btn.textContent = 'Yap'; return; }
  document.getElementById('compose-text').value = '';
  clearComposeMedia();
  btn.textContent = 'Yap';
  loadFeed();
}

async function toggleLike(postId, btn) {
  const liked = btn.dataset.liked === '1';
  const count = parseInt(btn.dataset.count) || 0;
  const newLiked = !liked, newCount = newLiked ? count + 1 : count - 1;
  btn.dataset.liked = newLiked ? '1' : '0'; btn.dataset.count = newCount;
  btn.classList.toggle('liked', newLiked);
  btn.querySelector('svg').setAttribute('fill', newLiked ? 'currentColor' : 'none');
  btn.querySelector('span').textContent = newCount;
  if (newLiked) {
    await _supabase.from('likes').insert({ user_id: currentProfile.id, post_id: postId });
    const post = posts.find(p => p.id === postId);
    if (post && post.user_id !== currentProfile.id)
      await _supabase.from('notifications').insert({ user_id: post.user_id, type: 'like', actor_id: currentProfile.id, post_id: postId });
  } else {
    await _supabase.from('likes').delete().eq('user_id', currentProfile.id).eq('post_id', postId);
  }
}

function replyToPost(postId) { window.location.href = `post.html?id=${postId}`; }

async function loadSuggestions() {
  const { data: following } = await _supabase.from('follows').select('following_id').eq('follower_id', currentProfile.id);
  const ids = (following || []).map(f => f.following_id); ids.push(currentProfile.id);
  const { data: users } = await _supabase.from('profiles').select('id,username,display_name,avatar_url,is_verified,is_admin')
    .not('id', 'in', `(${ids.join(',')})`)
    .limit(5);
  const container = document.getElementById('suggestions-list');
  if (!users?.length) { container.innerHTML = '<p style="color:var(--text2);font-size:14px">No suggestions right now</p>'; return; }
  container.innerHTML = users.map(u => `
    <div class="suggestion">
      <a href="profile.html?id=${u.id}">${avatarHtml(u, 40)}</a>
      <div class="info">
        <a href="profile.html?id=${u.id}" class="name">${escapeHtml(u.display_name||u.username)}</a>
        <div class="handle">@${escapeHtml(u.username)}</div>
      </div>
      <button class="follow-btn" onclick="followUser('${u.id}',this)">Follow</button>
    </div>`).join('');
}

async function followUser(userId, btn) {
  btn.disabled = true;
  const { error } = await _supabase.from('follows').insert({ follower_id: currentProfile.id, following_id: userId });
  if (!error) {
    await _supabase.from('notifications').insert({ user_id: userId, type: 'follow', actor_id: currentProfile.id });
    btn.closest('.suggestion').remove(); showToast('Followed!');
  } else btn.disabled = false;
}

init();
</script>
</body>
</html>
