<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapper — Sign in</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-left">
    <span style="font-size:72px;font-weight:900;letter-spacing:-3px;color:#fff;">Yapper</span>
  </div>
  <div class="auth-right">
    <!-- Login Form -->
    <div class="auth-box" id="login-box">
      <h1>Sign in to Yapper</h1>
      <p class="subtitle">Welcome back</p>
      <div class="error-msg" id="login-error"></div>
      <div class="success-msg" id="login-success"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
      </form>
      <div class="divider"><span>or</span></div>
      <div class="auth-switch">Don't have an account? <a href="#" id="show-signup">Sign up</a></div>
    </div>

    <!-- Signup Form -->
    <div class="auth-box hidden" id="signup-box" style="display:none">
      <h1>Join Yapper today</h1>
      <p class="subtitle">Connect and share your thoughts</p>
      <div class="error-msg" id="signup-error"></div>
      <div class="success-msg" id="signup-success"></div>
      <form id="signup-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-accent" id="signup-btn">Create account</button>
      </form>
      <div class="divider"><span>or</span></div>
      <div class="auth-switch">Already have an account? <a href="#" id="show-login">Sign in</a></div>
    </div>
  </div>
</div>

<script>
(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) { window.location.href = 'index.html'; return; }
})();

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
}
function hideMessages() {
  document.querySelectorAll('.error-msg, .success-msg').forEach(el => el.classList.remove('show'));
}

document.getElementById('show-signup').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('signup-box').style.display = 'block';
  hideMessages();
});
document.getElementById('show-login').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('signup-box').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
  hideMessages();
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await _supabase.auth.signInWithPassword({ email, password });
  if (error) {
    showError('login-error', error.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  } else {
    window.location.href = 'index.html';
  }
});

document.getElementById('signup-form').addEventListener('submit', async e => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('signup-btn');
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  if (password !== confirm) { showError('signup-error', 'Passwords do not match'); return; }
  btn.disabled = true; btn.textContent = 'Creating account...';
  const { error } = await _supabase.auth.signUp({ email, password });
  if (error) {
    showError('signup-error', error.message);
    btn.disabled = false; btn.textContent = 'Create account';
  } else {
    const success = document.getElementById('signup-success');
    success.textContent = 'Account created! Check your email to confirm, then sign in.';
    success.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create account';
    setTimeout(() => {
      document.getElementById('signup-box').style.display = 'none';
      document.getElementById('login-box').style.display = 'block';
    }, 3000);
  }
});
</script>
</body>
</html>
