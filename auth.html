<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapper — Sign in</title>
<link rel="stylesheet" href="css/style.css">
<style>
.btn-google {
  width: 100%; background: #fff; color: #3c4043; font-weight: 600; font-size: 15px;
  border-radius: 9999px; padding: 11px; margin-top: 8px;
  border: 1px solid #dadce0; display: flex; align-items: center; justify-content: center;
  gap: 10px; transition: background 0.2s, box-shadow 0.2s; cursor: pointer;
}
.btn-google:hover { background: #f8f8f8; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.btn-google svg { flex-shrink: 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-left">
    <span style="font-size:72px;font-weight:900;letter-spacing:-3px;color:#fff;">Yapper</span>
  </div>
  <div class="auth-right">

    <!-- Login Form -->
    <div class="auth-box" id="login-box">
      <h1>Sign in to Yapper</h1>
      <p class="subtitle">Welcome back</p>
      <div class="error-msg" id="login-error"></div>
      <div class="success-msg" id="login-success"></div>

      <button class="btn-google" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider"><span>or</span></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
      </form>

      <div class="auth-switch" style="margin-top:20px">Don't have an account? <a href="#" id="show-signup">Sign up</a></div>
    </div>

    <!-- Signup Form -->
    <div class="auth-box" id="signup-box" style="display:none">
      <h1>Join Yapper today</h1>
      <p class="subtitle">Connect and share your thoughts</p>
      <div class="error-msg" id="signup-error"></div>
      <div class="success-msg" id="signup-success"></div>

      <button class="btn-google" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign up with Google
      </button>

      <div class="divider"><span>or</span></div>

      <form id="signup-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-accent" id="signup-btn">Create account</button>
      </form>

      <div class="auth-switch" style="margin-top:20px">Already have an account? <a href="#" id="show-login">Sign in</a></div>
    </div>

  </div>
</div>

<script>
(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) { window.location.href = 'index.html'; return; }
})();

async function signInWithGoogle() {
  const redirectTo = new URL('index.html', window.location.href).href;
  const { error } = await _supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo }
  });
  if (error) alert('Google sign-in failed: ' + error.message);
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
}
function hideMessages() {
  document.querySelectorAll('.error-msg, .success-msg').forEach(el => el.classList.remove('show'));
}

document.getElementById('show-signup').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('signup-box').style.display = 'block';
  hideMessages();
});
document.getElementById('show-login').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('signup-box').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
  hideMessages();
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await _supabase.auth.signInWithPassword({ email, password });
  if (error) {
    showError('login-error', error.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  } else {
    window.location.href = 'index.html';
  }
});

document.getElementById('signup-form').addEventListener('submit', async e => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('signup-btn');
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  if (password !== confirm) { showError('signup-error', 'Passwords do not match'); return; }
  btn.disabled = true; btn.textContent = 'Creating account...';
  const { error } = await _supabase.auth.signUp({ email, password });
  if (error) {
    showError('signup-error', error.message);
    btn.disabled = false; btn.textContent = 'Create account';
  } else {
    const success = document.getElementById('signup-success');
    success.textContent = 'Account created! Check your email to confirm, then sign in.';
    success.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create account';
    setTimeout(() => {
      document.getElementById('signup-box').style.display = 'none';
      document.getElementById('login-box').style.display = 'block';
    }, 3000);
  }
});
</script>
</body>
</html>
